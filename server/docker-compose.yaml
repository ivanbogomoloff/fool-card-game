services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-foolcard}
      MYSQL_USER: ${DB_USER:-fool}
      MYSQL_PASSWORD: ${DB_PASSWORD:-foolsecret}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-fool}
      DB_PASSWORD: ${DB_PASSWORD:-foolsecret}
      DB_NAME: ${DB_NAME:-foolcard}
      LOG_DIR: /logs
    volumes:
      - ./logs:/logs

volumes:
  mariadb_data:
