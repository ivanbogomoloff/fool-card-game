syntax = "proto3";

package foolcard.v1;

option go_package = "foolcardgame/server/internal/pb;pb";

message LoginRequest {
  optional string username = 1;
  optional string password = 2;
}

message LoginResponse {
  string token = 1;
  string username = 2;
  string account_id = 3;
  // Plaintext только при первой регистрации аккаунта.
  optional string password = 4;
}

service Auth {
  rpc Login(LoginRequest) returns (LoginResponse);
}
