syntax = "proto3";

package foolcard.v1;

option go_package = "foolcardgame/server/internal/pb;pb";

message PlayerProfile {
  string display_name = 1;
  int32 avatar_id = 2;
}

message CreateGameResponse {
  string game_id = 1;
  string access_code = 2;
  string host_id = 3;
  string player_id = 4;
}

message JoinGameRequest {
  string code = 1;
  string display_name = 2;
  int32 avatar_id = 3;
}

message JoinGameResponse {
  string game_id = 1;
  string player_id = 2;
}

// Быстрая игра — только через Session.QuickMatch, не unary.
service Matchmaking {
  rpc CreateGame(PlayerProfile) returns (CreateGameResponse);
  rpc JoinGame(JoinGameRequest) returns (JoinGameResponse);
}
